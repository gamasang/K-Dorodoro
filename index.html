<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケイドロドロ (Keidrororo)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas Game Map -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="800"></canvas>
        </div>

        <!-- Sidebar Control Panel -->
        <div id="sidebar">
            <!-- Phase & Turn Card -->
            <div class="card">
                <div class="card-title">
                    <span>フェイズ管理</span>
                    <span id="turn-badge" class="status-badge">ターン 1</span>
                </div>
                <div class="phase-indicator">
                    現在の状態: 1. 計画フェイズ (Plot Phase)
                </div>
            </div>

            <!-- Selected Unit Info Card -->
            <div class="card">
                <div class="card-title">
                    <span>選択中のユニット</span>
                    <span id="unit-type-badge" class="status-badge">泥棒陣営</span>
                </div>
                <div class="unit-info-grid">
                    <div class="info-item">
                        <div class="info-label">ユニット名</div>
                        <div id="unit-name" class="info-val">スライム 1</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">現在座標 (Q, R)</div>
                        <div id="unit-pos" class="info-val">(-9, 0)</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">移動可能距離</div>
                        <div id="unit-speed" class="info-val">4 マス</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">プロット済み歩数</div>
                        <div id="unit-plot-count" class="info-val">0 マス</div>
                    </div>
                </div>
                <div style="margin-top: 6px;">
                    <div class="info-label">所持品 (スロット)</div>
                    <div id="unit-inv" class="inv-list">
                        <span class="inv-item">なし</span>
                    </div>
                </div>
            </div>

            <!-- Special Action Card (Dynamic for Police HQ supply, etc.) -->
            <div id="special-action-card" class="card" style="display: none;">
                <div id="special-card-title" class="card-title">特殊アクション</div>
                <div id="special-card-body"></div>
            </div>

            <!-- Action Controls Card -->
            <div class="card">
                <div class="card-title">操作コマンド</div>
                <div class="btn-group">
                    <button id="btn-execute-phase" class="btn-success">▶ 計画完了・移動実行</button>
                    <button id="btn-reset-unit-plot" class="btn-reset-plot">↺ 選択ユニットのプロットリセット</button>
                </div>
            </div>

            <!-- Game Log Card -->
            <div class="card">
                <div class="card-title">イベントログ</div>
                <div id="event-log"></div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
