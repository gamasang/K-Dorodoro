<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケイドロドロ (Keidrororo) - ターン制対戦シミュレーション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas Main View -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="920" height="750"></canvas>
        </div>

        <!-- Sidebar Control Panel -->
        <div id="sidebar">
            <!-- Header Status -->
            <div class="card">
                <div class="card-title">
                    <span>ケイドロドロ</span>
                    <span id="turn-badge" class="status-badge">ターン 1</span>
                </div>
                <div class="phase-indicator">計画フェイズ (プロット中)</div>
            </div>

            <!-- Active Unit Control -->
            <div class="card">
                <div class="card-title">
                    <span id="unit-name">スライム 1</span>
                    <span id="unit-type-badge" class="status-badge">泥棒陣営</span>
                </div>
                <div class="unit-info-grid">
                    <div class="info-item">
                        <div class="info-label">現在座標</div>
                        <div id="unit-pos" class="info-val">(-9, 0)</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">移動可能距離</div>
                        <div id="unit-speed" class="info-val">4 マス</div>
                    </div>
                </div>
                <div style="margin-top: 6px;">
                    <div class="info-label">プロット済み移動数</div>
                    <div id="unit-plot-count" class="info-val" style="color: #58a6ff;">0 マス</div>
                </div>
                <div style="margin-top: 8px;">
                    <div class="info-label">所持アイテム</div>
                    <div id="unit-inv" class="inv-list">
                        <span class="inv-item">なし</span>
                    </div>
                </div>
            </div>

            <!-- Special Action Card (Police Supply) -->
            <div id="special-action-card" class="card" style="display: none;">
                <div id="special-card-title" class="card-title" style="color: #3b82f6;">警察拠点 装備保管所</div>
                <div id="special-card-body"></div>
            </div>

            <!-- Action Buttons -->
            <div class="card btn-group">
                <button id="btn-reset-unit-plot" class="btn-reset-plot">選択ユニットのプロットリセット</button>
                <button id="btn-execute-phase" class="btn-success">ターン実行 (行動開始)</button>
            </div>

            <!-- Guide Legend -->
            <div class="card guide-section">
                <div class="info-label" style="margin-bottom: 4px;">マップ凡例・ヘルヘルプ</div>
                <div class="guide-item">
                    <div class="guide-square" style="background: #831843;"></div>
                    <div class="guide-text">泥棒拠点 (角A) / 泥棒スタート</div>
                </div>
                <div class="guide-item">
                    <div class="guide-square" style="background: #1e3a8a;"></div>
                    <div class="guide-text">警察拠点 (角D / 不可侵) / 装備保管</div>
                </div>
                <div class="guide-item">
                    <div class="guide-square" style="background: #4c1d95;"></div>
                    <div class="guide-text">牢屋 (警察拠点の3マス左)</div>
                </div>
                <div class="guide-item">
                    <div class="guide-square" style="background: #065f46;"></div>
                    <div class="guide-text">研究所 (お宝保管)</div>
                </div>
                <div class="guide-item">
                    <div class="guide-square" style="background: #854d0e;"></div>
                    <div class="guide-text">発電所 (侵入でハッキング5T)</div>
                </div>
            </div>

            <!-- Game Event Log -->
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="info-label" style="margin-bottom: 4px;">イベントログ</div>
                <div id="event-log"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
