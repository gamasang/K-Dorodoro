<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ヘックス・ケイドロ (開発テスト版)</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: manipulation; }
        #info { margin-bottom: 10px; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; }
        #container { width: 100vw; height: 75vh; overflow: auto; display: flex; justify-content: center; align-items: center; position: relative; }
        #map { position: relative; transform-origin: center; }
        
        /* CSSで綺麗な正六角形（ヘックス）を作る */
        .hex { position: absolute; width: 40px; height: 23.09px; background-color: #3a3a3a; margin: 11.55px 0; cursor: pointer; transition: all 0.2s; }
        .hex:before, .hex:after { content: ""; position: absolute; width: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; left: 0; }
        .hex:before { bottom: 100%; border-bottom: 11.55px solid #3a3a3a; }
        .hex:after { top: 100%; border-top: 11.55px solid #3a3a3a; }

        /* 隣接マスのハイライト（移動可能範囲） */
        .hex.movable { background-color: #2e5c36; }
        .hex.movable:before { border-bottom-color: #2e5c36; }
        .hex.movable:after { border-top-color: #2e5c36; }

        /* キャラクター表示用の中身 */
        .hex-inner { position: absolute; top: -6px; left: 0; width: 40px; height: 35px; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 10; pointer-events: none; }
        
        /* 警察と泥棒の見た目 */
        .police { filter: drop-shadow(0 0 4px #00f); }
        .thief { filter: drop-shadow(0 0 4px #f00); }
    </style>
</head>
<body>

<div id="info">👮 警察のターン（移動するマスをタップ）</div>
<div id="container">
    <div id="map"></div>
</div>

<script>
    // 1辺のマス数（9階層）
    const MAP_SIZE = 9;
    // ヘックスの描画サイズ計算用
    const HEX_WIDTH = 40;
    const HEX_HEIGHT = 46.18; // 23.09 * 2
    const HORIZ_DIST = HEX_WIDTH * 0.75;
    const VERT_DIST = HEX_HEIGHT;

    // ゲームの状態管理
    let turn = "police"; // "police" または "thief"
    let isGameOver = false;

    // 警察と泥棒の座標（ヘックス座標系: q, r）
    let policePos = { q: -(MAP_SIZE-1), r: 0 }; // 左端に配置
    let thiefPos = { q: MAP_SIZE-1, r: 0 };    // 右端に配置

    const mapElement = document.getElementById("map");
    const infoElement = document.getElementById("info");

    // 1辺9マスの六角形マップの座標データを生成
    const cells = [];
    for (let q = -MAP_SIZE + 1; q < MAP_SIZE; q++) {
        let r1 = Math.max(-MAP_SIZE + 1, -q - MAP_SIZE + 1);
        let r2 = Math.min(MAP_SIZE + 1, -q + MAP_SIZE);
        for (let r = r1; r < r2; r++) {
            cells.push({ q, r });
        }
    }

    // 2つのマスが隣接しているか判定（ヘックス座標の距離が1）
    function isNeighbor(pos1, pos2) {
        const dq = pos1.q - pos2.q;
        const dr = pos1.r - pos2.r;
        return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2 === 1;
    }

    // マップの描画処理
    function drawMap() {
        mapElement.innerHTML = "";
        
        // 現在のターン側の座標と移動可能判定
        const currentPos = (turn === "police") ? policePos : thiefPos;

        cells.forEach(cell => {
            const hex = document.createElement("div");
            hex.classList.add("hex");

            // 立体交差する軸から画面上のX, Yピクセル座標に変換
            const x = HORIZ_DIST * cell.q;
            const y = VERT_DIST * (cell.r + cell.q / 2);
            
            // マップの中心が画面真ん中にくるようオフセット配置
            hex.style.left = `${x + (MAP_SIZE * 30)}px`;
            hex.style.top = `${y + (MAP_SIZE * 35)}px`;

            // 移動可能な隣接マスならハイライト
            const movable = !isGameOver && isNeighbor(currentPos, cell);
            if (movable) {
                hex.classList.add("movable");
            }

            // キャラクターの配置
            const inner = document.createElement("div");
            inner.classList.add("hex-inner");
            if (cell.q === policePos.q && cell.r === policePos.r) {
                inner.innerText = "👮";
                inner.classList.add("police");
            } else if (cell.q === thiefPos.q && cell.r === thiefPos.r) {
                inner.innerText = "👤";
                inner.classList.add("thief");
            }
            hex.appendChild(inner);

            // タップ時の移動処理
            hex.addEventListener("click", () => {
                if (movable) {
                    if (turn === "police") {
                        policePos = { q: cell.q, r: cell.r };
                        checkCollision("thief", "👤 泥棒のターン");
                    } else {
                        thiefPos = { q: cell.q, r: cell.r };
                        checkCollision("police", "👮 警察のターン");
                    }
                }
            });

            mapElement.appendChild(hex);
        });
    }

    // 捕獲判定とターン切り替え
    function checkCollision(nextTurn, nextMessage) {
        if (policePos.q === thiefPos.q && policePos.r === thiefPos.r) {
            infoElement.innerText = "🎉 確保！警察の勝ちです！";
            isGameOver = true;
        } else {
            turn = nextTurn;
            infoElement.innerText = nextMessage;
        }
        drawMap();
    }

    // 初期起動
    drawMap();
</script>
</body>
</html>
