<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ヘックス・ケイドロ (美化修正版)</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: manipulation; }
        #info { margin-bottom: 15px; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 100; }
        #container { width: 100vw; height: 80vh; overflow: auto; display: flex; justify-content: center; align-items: center; position: relative; }
        #map { position: relative; width: 600px; height: 600px; }
        
        /* 辺と辺が完全にくっつく正六角形のCSS定義 */
        .hex { position: absolute; width: 34.64px; height: 40px; background-color: #3a3a3a; cursor: pointer; transition: all 0.15s; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        
        /* 隣接マスのハイライト（移動可能範囲） */
        .hex.movable { background-color: #2e5c36; box-shadow: inset 0 0 10px #5a8f52; }
        .hex:active { opacity: 0.7; }

        /* キャラクター表示用の中身 */
        .hex-inner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 10; pointer-events: none; }
        
        /* 警察と泥棒の視覚効果 */
        .police { filter: drop-shadow(0 0 4px #00f); }
        .thief { filter: drop-shadow(0 0 4px #f00); }
    </style>
</head>
<body>

<div id="info">👮 警察のターン（移動するマスをタップ）</div>
<div id="container">
    <div id="map"></div>
</div>

<script>
    // 1辺のマス数（9階層）
    const MAP_SIZE = 9;
    
    // 幾何学的に完全に密着させるためのサイズ計算（縦長ヘックス）
    const HEX_HEIGHT = 40; // 縦の長さ
    const HEX_WIDTH = Math.sqrt(3) / 2 * HEX_HEIGHT; // 横の長さ (約34.64px)

    // ゲームの状態管理
    let turn = "police";
    let isGameOver = false;

    // 初期配置：1辺9マスの大ヘックスの端と端に配置
    let policePos = { q: -(MAP_SIZE-1), r: 0 };
    let thiefPos = { q: MAP_SIZE-1, r: -(MAP_SIZE-1) };

    const mapElement = document.getElementById("map");
    const infoElement = document.getElementById("info");

    // 1辺9マスの六角形マップの座標データを生成
    const cells = [];
    for (let q = -MAP_SIZE + 1; q < MAP_SIZE; q++) {
        let r1 = Math.max(-MAP_SIZE + 1, -q - MAP_SIZE + 1);
        let r2 = Math.min(MAP_SIZE + 1, -q + MAP_SIZE);
        for (let r = r1; r < r2; r++) {
            cells.push({ q, r });
        }
    }

    // 2つのマスが隣接しているか判定
    function isNeighbor(pos1, pos2) {
        const dq = pos1.q - pos2.q;
        const dr = pos1.r - pos2.r;
        return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2 === 1;
    }

    // マップの描画処理
    function drawMap() {
        mapElement.innerHTML = "";
        const currentPos = (turn === "police") ? policePos : thiefPos;

        cells.forEach(cell => {
            const hex = document.createElement("div");
            hex.classList.add("hex");

            // ハニカム構造（辺を密着させる軸変換）
            // 縦長ヘックスの場合、横方向は 1.5マスのピッチ、縦方向は 1マス + 半マスのズレになります
            const x = HEX_WIDTH * (cell.q + cell.r / 2);
            const y = HEX_HEIGHT * 0.75 * cell.r;
            
            // マップ全体がコンテナの真ん中にくるよう調整（オフセット座標）
            const offsetX = 300 - (HEX_WIDTH / 2);
            const offsetY = 300 - (HEX_HEIGHT / 2);
            hex.style.left = `${x + offsetX}px`;
            hex.style.top = `${y + offsetY}px`;

            // 移動可能な隣接マスならハイライト
            const movable = !isGameOver && isNeighbor(currentPos, cell);
            if (movable) {
                hex.classList.add("movable");
            }

            // キャラクターの配置
            const inner = document.createElement("div");
            inner.classList.add("hex-inner");
            if (cell.q === policePos.q && cell.r === policePos.r) {
                inner.innerText = "👮";
                inner.classList.add("police");
            } else if (cell.q === thiefPos.q && cell.r === thiefPos.r) {
                inner.innerText = "👤";
                inner.classList.add("thief");
            }
            hex.appendChild(inner);

            // タップ時の移動処理
            hex.addEventListener("click", () => {
                if (movable) {
                    if (turn === "police") {
                        policePos = { q: cell.q, r: cell.r };
                        checkCollision("thief", "👤 泥棒のターン");
                    } else {
                        thiefPos = { q: cell.q, r: cell.r };
                        checkCollision("police", "👮 警察のターン");
                    }
                }
            });

            mapElement.appendChild(hex);
        });
    }

    // 捕獲判定とターン切り替え
    function checkCollision(nextTurn, nextMessage) {
        if (policePos.q === thiefPos.q && policePos.r === thiefPos.r) {
            infoElement.innerText = "🎉 確保！警察の勝ちです！";
            isGameOver = true;
        } else {
            turn = nextTurn;
            infoElement.innerText = nextMessage;
        }
        drawMap();
    }

    // 初期起動
    drawMap();
</script>
</body>
</html>
